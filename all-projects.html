<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karuidesu — Portfolio</title>
  <meta name="description"
    content="Portfolio de Kekeli Diane ADONSOU — Software Engineer, Business Systems Analyst et Web Developer basée à Lomé, Togo." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap"
    rel="stylesheet">

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- Lordicon for animated Lotties (if still needed) -->
  <script src="https://cdn.lordicon.com/lordicon.js"></script>
  
  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Playfair Display', 'Georgia', 'serif'],
            body: ['Outfit', 'system-ui', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7', // Primary blue
              700: '#0369a1', // Dark blue
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          animation: {
            'float-slow': 'float 4s ease-in-out infinite',
            'float-fast': 'float 2.5s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: 1, boxShadow: '0 0 0 0 rgba(2, 132, 199, 0.4)' },
              '50%': { opacity: .7, boxShadow: '0 0 20px 10px rgba(2, 132, 199, 0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles (minimal) -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="bg-slate-50 text-slate-800 font-body antialiased overflow-x-hidden selection:bg-brand-200 selection:text-brand-900">

  <!-- App Container -->
  <div id="app" data-page="all-projects" class="flex flex-col min-h-screen"></div>

  <!-- Scripts -->
  <script src="js/translations.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
